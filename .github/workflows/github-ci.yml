name: LKUSER CI

# Brute force build a bunch of variants of LK userspace in parallel jobs.

on: [ push, pull_request ]

# These jobs only build the tree; they never write back to the repo.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        toolchain-ver: [15.2.0, 11.3.0]
        arch:
          - riscv
          - riscv32

    env:
      TOOLCHAIN_VER: ${{ matrix.toolchain-ver }}
      ARCH: ${{ matrix.arch }}
    steps:
    - name: banner
      shell: bash
      run: |
        printf "Building with %d processors\n" "$(nproc)"
        grep -oP '(?<=model name\t: ).*' /proc/cpuinfo|head -n1
        echo TOOLCHAIN_VER = $TOOLCHAIN_VER
        echo ARCH = $ARCH

    # check out the source
    - name: checkout source
      uses: actions/checkout@v6
      with:
        submodules: true

    # compute the toolchains this arch needs: user space takes arch.mk's prefix and LK picks
    # the kernel's own, so riscv32 needs riscv32-elf- beside its user space's riscv64-elf-.
    # TOOLCHAIN_PREFIX is not exported, or it would override LK's choice.
    - name: compute toolchains
      shell: bash
      run: |
        PREFIXES=$(make list-toolchain | grep TOOLCHAIN_PREFIX | tail -1 | cut -d ' ' -f 3)
        case "$ARCH" in
          riscv32) PREFIXES="$PREFIXES riscv32-elf-" ;;
        esac
        TOOLCHAINS=
        for p in $PREFIXES; do
          TOOLCHAINS="$TOOLCHAINS ${p}${TOOLCHAIN_VER}-$(uname)-$(uname -m)"
        done
        echo "TOOLCHAINS=${TOOLCHAINS# }" >> $GITHUB_ENV

    # maintain a directory archives/ in the repo
    # it will contain tarballs of various toolchains
    - name: cache
      uses: actions/cache@v5
      id: cache
      with:
        # A list of files, directories, and wildcard patterns to cache and restore
        path: archives
        # An explicit key for restoring and saving the cache
        key: archives-${{ env.TOOLCHAINS }}

    # download the toolchains from https://newos.org/toolchains
    - name: fetch/extract toolchains
      shell: bash
      run: |
        TOOLCHAIN_BASE_URL="https://newos.org/toolchains"
        TOOLCHAIN_SUFFIX="tar.xz"
        mkdir -p archives
        for TOOLCHAIN in $TOOLCHAINS; do
          TOOLCHAIN_ADDRESS="$TOOLCHAIN_BASE_URL/$TOOLCHAIN.$TOOLCHAIN_SUFFIX"
          echo "Downloading toolchain $TOOLCHAIN from $TOOLCHAIN_ADDRESS"
          (cd archives && wget -v -N $TOOLCHAIN_ADDRESS) || exit 1
          echo "Unpacking $TOOLCHAIN"
          tar xf archives/$TOOLCHAIN.$TOOLCHAIN_SUFFIX || exit 1
          echo "$GITHUB_WORKSPACE/$TOOLCHAIN/bin" >> $GITHUB_PATH
        done

    # build it
    - name: build
      shell: bash
      run: |
        make -j $(nproc)

    # upload artifacts
    #- uses: actions/upload-artifact@v2
    #  with:
    #   name: build-dir
    #   path: build-${{ matrix.project }}/lk.*

